name: tatachat_sdk
description: Independent end-to-end encrypted chat SDK for mobile clients and self-hosted servers.
version: 1.0.0
# 当前交付为完整Git/ZIP SDK，pub.dev发布另行处理。
publish_to: none
homepage: https://github.com/tuyutata/tatachatsdk
repository: https://github.com/tuyutata/tatachatsdk
issue_tracker: https://github.com/tuyutata/tatachatsdk/issues
topics:
  - chat
  - end-to-end-encryption
  - flutter
  - messaging
  - openmls

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

workspace:
  - core
  - protocol
  - mls
  - group
  - storage
  - transport
  - attachment
  - call
  - runtime
  - assets
  - testing

dependencies:
  camera: ^0.12.0+2
  emoji_picker_flutter: 4.5.4
  flutter:
    sdk: flutter
  flutter_blurhash: ^0.9.1
  flutter_chat_core: ^2.9.0
  flutter_chat_ui: ^2.11.1
  flutter_webrtc: ^1.5.2
  image_picker: ^1.2.3
  just_audio: ^0.10.6
  provider: ^6.1.5+1
  video_player: 2.11.1
  wechat_assets_picker: ^10.1.2
  tatachat_core:
    path: core
  tatachat_protocol:
    path: protocol
  tatachat_mls:
    path: mls
  tatachat_group:
    path: group
  tatachat_storage:
    path: storage
  tatachat_transport:
    path: transport
  tatachat_attachment:
    path: attachment
  tatachat_call:
    path: call
  tatachat_runtime:
    path: runtime
  tatachat_assets:
    path: assets

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  tatachat_testing:
    path: testing

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: chat.tata.sdk
        pluginClass: TataChatSdkPlugin
        ffiPlugin: true
      ios:
        pluginClass: TataChatSdkPlugin
        ffiPlugin: true
