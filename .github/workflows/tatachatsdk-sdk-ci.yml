# tatachatsdk.sdk.ci 的独立 GitHub 工作流。
name: tatachatsdk.sdk.ci
# 远端标题只展示产品、平台、流程；内部 pipeline 仍承担唯一机器身份。
run-name: "${{ inputs.run_title }}"
'on':
  workflow_dispatch:
    inputs:
      pipeline:
        required: true
        type: string
      run_title:
        required: true
        type: string
      source_sha:
        required: false
        type: string
      ci_run_id:
        required: false
        type: string
      version_tag:
        required: false
        type: string
      software_version:
        required: false
        type: string
      spec_version:
        required: false
        type: string
      chain_spec_version:
        required: false
        type: string
      genesis_hash:
        required: false
        type: string
      finalized_head:
        required: false
        type: string
concurrency:
  group: tatachatsdk.sdk.ci
  cancel-in-progress: false
jobs:
  flow:
    name: SDK 源码、原生核心与三端候选检查
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
      GH_TOKEN: "${{ github.token }}"
      TATACHATSDK_SOURCE_SHA: "${{ github.sha }}"
      SOURCE_SHA: "${{ github.sha }}"
    steps:
    - shell: bash
      env:
        PIPELINE: "${{ inputs.pipeline }}"
        RUN_TITLE: "${{ inputs.run_title }}"
        SOURCE_SHA: "${{ inputs.source_sha }}"
        CI_RUN_ID: "${{ inputs.ci_run_id }}"
        VERSION_TAG: "${{ inputs.version_tag }}"
        SOFTWARE_VERSION: "${{ inputs.software_version }}"
        SPEC_VERSION: "${{ inputs.spec_version }}"
        CHAIN_SPEC_VERSION: "${{ inputs.chain_spec_version }}"
        GENESIS_HASH: "${{ inputs.genesis_hash }}"
        FINALIZED_HEAD: "${{ inputs.finalized_head }}"
      run: |-
        node --input-type=module <<'NODE'
        const e=process.env,allowed=new Set(["tatachatsdk.sdk.ci"]);
        if(!allowed.has(e.PIPELINE||''))throw Error('产品流程身份无效');
        if(e.RUN_TITLE!=="塔塔聊天SDK · SDK · CI")throw Error('产品平台流程展示标题无效');
        if([e.CI_RUN_ID,e.VERSION_TAG,e.SOFTWARE_VERSION,e.SPEC_VERSION,e.CHAIN_SPEC_VERSION,e.GENESIS_HASH,e.FINALIZED_HEAD].some(Boolean))throw Error('CI输入包含Release字段');
        NODE
    - name: 检出准确TataChatSDK源码
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
        persist-credentials: false
    - name: 装载准确Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - name: 装载准确Rust
      uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
      with:
        toolchain: 1.97.1
        targets: aarch64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
    - name: 装载Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      with:
        packages: platform-tools
    - id: tatachatsdk_ci_sdk__check__ci_cache
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_CACHE_PRODUCT: tatachatsdk
        CI_CACHE_PLATFORM: sdk
        CI_CACHE_ARCHITECTURE: sdk
        CI_CACHE_COMPONENT: tatachatsdk-ci-sdk--check
        CI_CACHE_WORKFLOW: tatachatsdk-sdk
        CI_CACHE_JOB: tatachatsdk-ci-sdk--check
        CI_CACHE_TOOLCHAIN_FINGERPRINT: "${{ hashFiles('**/Cargo.lock', '**/pubspec.lock', '**/package-lock.json', '**/dependencies.lock.json', '**/runtime.lock.json') }}"
        CI_CACHE_PATHS: |
          cargo-home
          cargo-target
          dart-pub
          xdg
        CI_CACHE_LINKS: ''
        CI_CACHE_FINALS: |
          cargo-target/aarch64-linux-android/release/libtatachat_sdk.so
          cargo-target/aarch64-apple-ios/release/libtatachat_sdk.dylib
          cargo-target/aarch64-apple-ios-sim/release/libtatachat_sdk.dylib
          cargo-target/aarch64-apple-darwin/release/libtatachat_sdk.dylib
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 0
    - name: 恢复上一次成功的CI增量缓存
      continue-on-error: true
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: "${{ steps.tatachatsdk_ci_sdk__check__ci_cache.outputs.success_paths }}"
        key: "${{ steps.tatachatsdk_ci_sdk__check__ci_cache.outputs.restore_key }}"
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 1
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 2
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 3
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 4
    - id: tatachatsdk_ci_sdk__check__flutter-version
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 5
    - name: 安装 Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: "${{ steps.tatachatsdk_ci_sdk__check__flutter-version.outputs.version }}"
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 6
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 7
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 8
    - working-directory: "${{ github.workspace }}/target/ci/tatachatsdk/build-source"
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 9
    - env:
        ANDROID_NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/28.2.13676358"
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 10
    - if: "${{ success() }}"
      name: 上传准确 TataChatSDK CI 原生候选
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: TataChatSDK-CI
        path: |
          ${{ github.workspace }}/target/ci/tatachatsdk/native
          ${{ github.workspace }}/target/ci/tatachatsdk/source-sha.txt
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
    - if: "${{ failure() && !cancelled() && steps.tatachatsdk_ci_sdk__check__ci_cache.outcome == 'success' }}"
      env:
        CI_CACHE_TERMINAL_STATE: failure
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 11
    - if: "${{ failure() && !cancelled() && steps.tatachatsdk_ci_sdk__check__ci_cache.outcome == 'success' }}"
      name: 保存本次失败的CI增量缓存
      id: tatachatsdk_ci_sdk__check__ci_cache_save_failure
      continue-on-error: true
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: "${{ steps.tatachatsdk_ci_sdk__check__ci_cache.outputs.failure_paths }}"
        key: "${{ steps.tatachatsdk_ci_sdk__check__ci_cache.outputs.failure_key }}"
    - if: "${{ failure() && !cancelled() && steps.tatachatsdk_ci_sdk__check__ci_cache.outcome == 'success' && steps.tatachatsdk_ci_sdk__check__ci_cache_save_failure.outcome == 'success' }}"
      continue-on-error: true
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_CACHE_TERMINAL_STATE: failure
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 12
    - if: "${{ success() }}"
      env:
        CI_CACHE_TERMINAL_STATE: success
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 13
    - if: "${{ success() }}"
      name: 保存本次成功的CI增量缓存
      id: tatachatsdk_ci_sdk__check__ci_cache_save_success
      continue-on-error: true
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
      with:
        path: "${{ steps.tatachatsdk_ci_sdk__check__ci_cache.outputs.success_paths }}"
        key: "${{ steps.tatachatsdk_ci_sdk__check__ci_cache.outputs.success_key }}"
    - if: "${{ success() && steps.tatachatsdk_ci_sdk__check__ci_cache_save_success.outcome == 'success' }}"
      continue-on-error: true
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_CACHE_TERMINAL_STATE: success
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/ci/sdk.mjs" workflow-step 14
