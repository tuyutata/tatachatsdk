name: tatachatsdk.sdk
run-name: "TataChatSDK-${{ inputs.version }}"
'on':
  workflow_dispatch:
    inputs:
      version:
        description: 本轮候选成功版本，由产品派发入口计算
        required: true
        type: string
env:
  SDK_VERSION: "${{ inputs.version }}"
concurrency:
  group: "${{ github.repository }}-sdk"
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 提前核对GitHub Runner正式工具
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v25.2.1"
          command -v gh
          command -v tar
          /usr/bin/xcrun --find llvm-nm >/dev/null
          /usr/bin/xcodebuild -version >/dev/null
          test -x /usr/bin/plutil
      - name: 核对候选版本和Run名称
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: node scripts/build.mjs ci-version-check
      - name: 先执行本仓代码回归
        shell: bash
        run: node --test scripts/build.mjs
  native:
    needs: test
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target: [android, ios, macos]
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin
          components: rust-src
      - name: 恢复本平台最新Cargo增量数据
        id: cargo_cache_restore
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: "${{ runner.temp }}/tatachatsdk-cargo-${{ matrix.target }}"
          key: "tatachatsdk-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('native/Cargo.lock', 'scripts/build.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}"
          restore-keys: |
            tatachatsdk-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('native/Cargo.lock', 'scripts/build.mjs') }}-
      - name: 编译并验收本平台原生件
        id: native_build
        shell: bash
        run: node scripts/build.mjs ci-native "${{ matrix.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "native-${{ matrix.target }}"
          path: "${{ runner.temp }}/tatachatsdk-native-${{ matrix.target }}"
          if-no-files-found: error
          retention-days: 7
      - name: 保存本平台Cargo增量数据
        id: cargo_cache_save
        if: steps.native_build.outputs.cargo_cache_ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: "${{ runner.temp }}/tatachatsdk-cargo-${{ matrix.target }}"
          key: "tatachatsdk-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('native/Cargo.lock', 'scripts/build.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}"
  release:
    needs: native
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: "${{ runner.temp }}/native-artifacts"
          merge-multiple: false
      - name: 汇总三平台并创建唯一正式 SDK Release
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: node scripts/build.mjs ci-release
  cargo-retention:
    needs: [native, release]
    if: always() && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target: [android, ios, macos]
    runs-on: xcode-27
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 只保留本平台最新一份Cargo增量数据
        env:
          CARGO_CACHE_KEY: "tatachatsdk-cargo-v1-macOS-ARM64-${{ matrix.target }}-${{ hashFiles('native/Cargo.lock', 'scripts/build.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}"
        shell: bash
        run: node scripts/build.mjs ci-cache-prune "${{ matrix.target }}" "$CARGO_CACHE_KEY"
  run-retention:
    needs: [test, native, release, cargo-retention]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 仅保留本工作流最新成功与失败记录
        env:
          GH_TOKEN: "${{ github.token }}"
          SDK_FINAL_OUTCOME: "${{ needs.test.result == 'success' && needs.native.result == 'success' && needs.release.result == 'success' && needs.cargo-retention.result == 'success' && 'success' || 'failure' }}"
        shell: bash
        run: node scripts/build.mjs ci-run-prune "$SDK_FINAL_OUTCOME"
