# tatachatsdk.sdk.release 的独立 GitHub 工作流。
name: tatachatsdk.sdk.release
# 远端标题只展示产品、平台、流程；内部 pipeline 仍承担唯一机器身份。
run-name: "${{ inputs.run_title }}"
'on':
  workflow_dispatch:
    inputs:
      pipeline:
        required: true
        type: string
      run_title:
        required: true
        type: string
      source_sha:
        required: false
        type: string
      ci_run_id:
        required: false
        type: string
      version_tag:
        required: false
        type: string
      software_version:
        required: false
        type: string
      spec_version:
        required: false
        type: string
      chain_spec_version:
        required: false
        type: string
      genesis_hash:
        required: false
        type: string
      finalized_head:
        required: false
        type: string
concurrency:
  group: tatachatsdk.sdk.release
  cancel-in-progress: false
jobs:
  flow:
    name: SDK 单一正式包验真与固化
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
    env:
      CI: true
      WRANGLER_SEND_METRICS: false
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: '0'
      GH_TOKEN: "${{ github.token }}"
      TATACHATSDK_SOURCE_SHA: "${{ inputs.source_sha }}"
      TATACHATSDK_CI_RUN_ID: "${{ inputs.ci_run_id }}"
      TATACHATSDK_VERSION_TAG: "${{ inputs.version_tag }}"
      TATACHATSDK_SOFTWARE_VERSION: "${{ inputs.software_version }}"
      TATACHATSDK_SPEC_VERSION: "${{ inputs.spec_version }}"
      TATACHATSDK_CHAIN_SPEC_VERSION: "${{ inputs.chain_spec_version }}"
      TATACHATSDK_CHAIN_GENESIS_HASH: "${{ inputs.genesis_hash }}"
      TATACHATSDK_CHAIN_FINALIZED_HEAD: "${{ inputs.finalized_head }}"
      SOURCE_SHA: "${{ inputs.source_sha }}"
      CI_RUN_ID: "${{ inputs.ci_run_id }}"
      VERSION_TAG: "${{ inputs.version_tag }}"
      SOFTWARE_VERSION: "${{ inputs.software_version }}"
      SPEC_VERSION: "${{ inputs.spec_version }}"
      CHAIN_SPEC_VERSION: "${{ inputs.chain_spec_version }}"
      GENESIS_HASH: "${{ inputs.genesis_hash }}"
      FINALIZED_HEAD: "${{ inputs.finalized_head }}"
    steps:
    - shell: bash
      env:
        PIPELINE: "${{ inputs.pipeline }}"
        RUN_TITLE: "${{ inputs.run_title }}"
        SOURCE_SHA: "${{ inputs.source_sha }}"
        CI_RUN_ID: "${{ inputs.ci_run_id }}"
        VERSION_TAG: "${{ inputs.version_tag }}"
        SOFTWARE_VERSION: "${{ inputs.software_version }}"
        SPEC_VERSION: "${{ inputs.spec_version }}"
        CHAIN_SPEC_VERSION: "${{ inputs.chain_spec_version }}"
        GENESIS_HASH: "${{ inputs.genesis_hash }}"
        FINALIZED_HEAD: "${{ inputs.finalized_head }}"
      run: |-
        node --input-type=module <<'NODE'
        const e=process.env,allowed=new Set(["tatachatsdk.sdk.release"]);
        if(!allowed.has(e.PIPELINE||''))throw Error('产品流程身份无效');
        if(e.RUN_TITLE!=="塔塔聊天SDK · SDK · Release")throw Error('产品平台流程展示标题无效');
        if(!/^[0-9a-f]{40}$/.test(e.SOURCE_SHA||'')||!/^[1-9][0-9]*$/.test(e.CI_RUN_ID||'')||!e.VERSION_TAG)throw Error('Release来源输入无效');
        if(!e.SOFTWARE_VERSION||[e.SPEC_VERSION,e.CHAIN_SPEC_VERSION,e.GENESIS_HASH,e.FINALIZED_HEAD].some(Boolean))throw Error('软件Release输入无效');
        NODE
    - name: 检出准确TataChatSDK源码
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        ref: "${{ inputs.source_sha }}"
        fetch-depth: 0
        persist-credentials: false
    - name: 装载准确Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 25.2.1
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/release/check/execute.mjs" workflow-step 0
    - env:
        GH_TOKEN: "${{ github.token }}"
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/release/check/execute.mjs" workflow-step 1
    - env:
        GH_TOKEN: "${{ github.token }}"
      shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/release/check/execute.mjs" workflow-step 2
    - shell: bash
      run: node "$GITHUB_WORKSPACE/scripts/release/check/execute.mjs" workflow-step 3
    - name: 签署 TataChatSDK 单一正式包构建来源
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
      with:
        subject-path: ${{ github.workspace }}/target/release/tatachatsdk/release/tatachatsdk.tgz
    - env:
        GH_TOKEN: "${{ github.token }}"
      shell: bash
      run: |
        notes="$(printf 'TATACHATSDK_RELEASE_CI_RUN_ID:%s\nTATACHATSDK_RELEASE_RUN_ID:%s' "$CI_RUN_ID" "$GITHUB_RUN_ID")"
        node "$GITHUB_WORKSPACE/scripts/release/index.mjs" github-release \
          --tag "$VERSION_TAG" --source-sha "$SOURCE_SHA" \
          --title "塔塔聊天SDK · Release · SDK" --notes "$notes" --latest false \
          --assets "$GITHUB_WORKSPACE/target/release/tatachatsdk/release/tatachatsdk.tgz"
